[build-system]
requires = ["setuptools>=77.0.0", "wheel", "setuptools_scm>=6.2", "numpy==1.26.4"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-sim"
description = "A high-fidelity simulation server that implements the Franka robot network protocol, enabling seamless switching between simulation and hardware."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dynamic = ["version"]  # Use dynamic versioning from git tags

authors = [
  { name = "Baris Yazici", email = "barisyazici@alumni.sabanciuniv.edu" }
]
license = { text = "Apache-2.0" }

keywords = ["robotics", "simulation", "franka", "robot", "genesis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy>=2.2.0",
  "genesis-world==0.3.10",
  "numba",
  "torch>=2.0.0",
  "pytest",
  "matplotlib>=3.7.2",
  "ipykernel>=6.0.0",
  "jupyterlab>=4.0.0",
  "pin==3.4.0",
]

[project.urls]
Homepage = "https://github.com/BarisYazici/libfranka-sim"
Bug_Tracker = "https://github.com/BarisYazici/libfranka-sim/issues"
Documentation = "https://github.com/BarisYazici/libfranka-sim#readme"

[project.scripts]
run-franka-sim-server = "franka_sim.run_server:main"

[project.optional-dependencies]
dev = [
  "pre-commit>=3.5.0",
  "black>=24.1.1",
  "isort>=5.13.2",
  "flake8>=7.0.0",
  "flake8-docstrings>=1.7.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ipykernel"
]

[tool.setuptools]
packages = ["franka_sim"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=franka_sim --cov-report=term-missing"

[tool.setuptools_scm]
fallback_version = "0.1.5"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

########################
# Pixi
########################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Ensure your package itself is installed into the Pixi env (editable).
[tool.pixi.pypi-dependencies]
franka-sim = { path = ".", editable = true }

[tool.pixi.pypi-options]
# extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

# Optional but recommended: force these names to be resolved from the cu128 index.
# [tool.pixi.pypi-options.extra-index-urls]
# torch = "https://download.pytorch.org/whl/cu128"
# torchvision = "https://download.pytorch.org/whl/cu128"
# torchaudio = "https://download.pytorch.org/whl/cu128"

[tool.pixi.environments]
default = { features = [] }

[tool.pixi.tasks.jupyterlab]
args = [{"arg" = "port", "default" = "6657"}]
cmd = "jupyter lab --port {{port}}"
